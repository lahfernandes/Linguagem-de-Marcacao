<!DOCTYPE html>
<html lang="pt-br">

	<head>

	<meta charset="UTF-8">
	<title>Exemplo 01 Tabbela</title>

		<body>

		<!-- table -> tabela -->
		<!-- iniciando -> tabela -->

			<table border="1" width = "100%">

					<thead style="background-color: #a3a3a3;">

					<!--table row -> linha da tabela-->

					<tr>

					<!-- cabeçalho -->

					<th colspan="5" style="background-color:#79d664; " ><h1>Tabela de Serviço Mecânicos<h1></th>

					</tr>



				</thead>

					<tr>

						<th  rowspan="5" style="background-color:#124c4a; ">Nacionais </th>
						<th>Veículo</th>
						<th>Serviço</th>
						<th>Tempo Previsto</th>
						<th>Valor</th>

					</tr>

					<tr>


						<td>Caminhonete S10</td>
						<td>Suspenção </td>
						<td>3 horas e 25 minutos</td>
						<td>350,00</td>

					</tr>

					<tr>
					
						<td>Caminhonete Ranger</td>
						<td>Freio </td>
						<td>3 horas e 45 minutos</td>
						<td>200,00</td>

					</tr>

					<tr>

						<td>Caminhonete Hilux</td>
						<td>Trocar a bateria </td>
						<td>30 minutos</td>
						<td>25,00</td>

					</tr>

					<tr>

						<td>Caminhonete D10</td>
						<td>Alinhamento </td>
						<td>1 horas e 40 minutos</td>
						<td>220,00</td>

					</tr>

			</table>

		</body>

	</head>

</html>
