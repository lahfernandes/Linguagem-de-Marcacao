<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de Usuário</title>
	</head>
	<body>
		<!-- Criar o formulário
		<form> - tag de formulárioAtributo "action" aponta para uma página
		Atributo "method":
			-GET: passa os dados pela URL
			_ POST: passa os dados pelo corpo
			
			-->
			<form action="#" method="POST">
				<!-- Label - rótulo do campo -->
				<label>Nome Completo:</label>
				<br>
				<!-- INPUT - campo de entrada de dados 
					TYPE - tipo de campo 
					ID - identificador (para javascript)
					NAME - identificador (para PHP)
				-->
				<input type="text" id= "nome" name="nome">
				<br><br>
				<!-- INPUT SUBMIT criar um botão -->
				<input type="submit" value="Cadastrar">
				
			</form>
		</body>
	</html>
